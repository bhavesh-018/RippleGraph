# =============================================================================
# RippleGraph — Docker Compose
# Services: FalkorDB graph engine + Python FastAPI backend + Vite frontend dev
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # FalkorDB — Graph Database Engine
  # ---------------------------------------------------------------------------
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ripplgraph-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend — FastAPI + Uvicorn
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripplgraph-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=ripplgraph
      - LOG_LEVEL=info
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — Vite React Dev Server (development only)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ripplgraph-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  falkordb_data:
    driver: local
